<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { background:#232323; color:#ddd; font:13px -apple-system, sans-serif;
         margin:0; padding:14px; }
  button { width:100%; padding:10px; font-size:14px; background:#2f5d8f;
           color:white; border:0; border-radius:4px; cursor:pointer; }
  button:hover { background:#3a6dad; }
  p { color:#999; margin:10px 0 0; line-height:1.4; }
</style></head>
<body>
  <button id="go">Add captions to this sequence</button>
  <p>Uses your .mogrt text style. Open the target sequence first; it asks for
     the .mogrt, then labels every clip from its name.</p>
  <script>
    document.getElementById('go').onclick = function () {
      var ext = window.__adobe_cep__.getSystemPath('extension');
      var jsx = ext + '/jsx/add_labels.jsx';
      window.__adobe_cep__.evalScript(
        '$.evalFile(' + JSON.stringify(jsx) + ')', function () {});
    };
  </script>
</body></html>
